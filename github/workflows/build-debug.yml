steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Install Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android build tools and platform
    shell: bash
    run: |
      sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

  - name: Extract source archive
    shell: bash
    run: |
      set -e
      if [ ! -f dnstt-ghosts-source.zip ]; then
        echo "Missing dnstt-ghosts-source.zip in repository root"
        exit 1
      fi
      mkdir -p extracted
      unzip -q dnstt-ghosts-source.zip -d extracted
      echo "Extracted archive contents:"
      find extracted -maxdepth 3 -type f | sed 's#^#/#' | head -n 100

  - name: Find Android project root
    id: project-root
    shell: bash
    run: |
      set -e
      GRADLE_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
      if [ -z "$GRADLE_FILE" ]; then
        echo "No Gradle build file was found in the extracted archive."
        find extracted -maxdepth 4 -type f | head -n 200
        exit 1
      fi
      PROJECT_ROOT=$(dirname "$(dirname "$GRADLE_FILE")")
      echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
      echo "Detected project root: $PROJECT_ROOT"
      echo "Detected Gradle file: $GRADLE_FILE"

  - name: Build debug APK
    shell: bash
    run: |
      set -e
      cd "${{ steps.project-root.outputs.project_root }}"
      if [ ! -f gradlew ]; then
        echo "gradlew not found in project root. Listing project directory..."
        ls -la
        exit 1
      fi
      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: dnstt-debug-apk
      path: |
        ${{ steps.project-root.outputs.project_root }}/app/build/outputs/apk/debug/*.apk
        ${{ steps.project-root.outputs.project_root }}/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
